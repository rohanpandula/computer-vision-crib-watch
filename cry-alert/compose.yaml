name: cry-alert

# Settings come from .env (copy .env.example). Run from this directory.
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.0
    container_name: cry-alert
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 128mb
    env_file:
      - .env
    volumes:
      - ./config:/config
      - ./media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8971:8971"

  # Optional: listen to the crib from a phone or computer on your network. Off unless you ask for it:
  #   docker compose --profile listen up -d
  # It has no login, so anyone on your network can open it and hear the room.
  listen:
    profiles: ["listen"]
    image: python:3.12-slim
    container_name: cry-alert-listen
    restart: unless-stopped
    command: ["python", "-u", "/app/listen.py", "--web"]
    environment:
      LISTEN_PORT: ${LISTEN_PORT:-8766}
      LISTEN_SOURCE: http://frigate:1984/api/stream.aac?src=crib
    ports:
      - "${LISTEN_PORT:-8766}:${LISTEN_PORT:-8766}"
    volumes:
      - ./listen.py:/app/listen.py:ro
    read_only: true
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0     # lets LISTEN_PORT=80 work without extra privileges
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m

  # Announces the page's name with Bonjour. This half does nothing else, and it is separate because
  # Bonjour has to run on the real network while the page reaches the camera's audio on Docker's.
  listen-bonjour:
    profiles: ["listen"]
    image: python:3.12-slim
    container_name: cry-alert-listen-bonjour
    restart: unless-stopped
    network_mode: host
    command: ["python", "-u", "/app/listen.py", "--bonjour"]
    environment:
      LISTEN_PORT: ${LISTEN_PORT:-8766}
      LISTEN_NAME: ${LISTEN_NAME-crib-audio}
      LISTEN_IP: ${LISTEN_IP:-}
    volumes:
      - ./listen.py:/app/listen.py:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 32m
